name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify acceptance matrix
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path
          with Path('docs/acceptance.tsv').open(newline='') as file:
              rows = list(csv.DictReader(file, delimiter='\t'))
          ids = [row['id'] for row in rows]
          assert len(ids) == len(set(ids))
          assert all(len(row) == 5 and all(row.values()) for row in rows)
          assert {'DESKTOP', 'AGENT', 'SDK', 'OBS', 'MGMT', 'TOPICS', 'PKG'} <= {i.split('-')[0] for i in ids}
          PY
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Rust
        run: rustup show
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
  electron:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --prefix desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm run build --prefix desktop && npm test --prefix desktop
