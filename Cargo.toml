[package]
name = "confuse"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[dependencies]
anyhow = "1"
async-stream = "0.3"
futures-util = "0.3"
hdbscan-rs = { version = "=0.6.1", default-features = false }
holomap = { version = "=0.3.0", default-features = false }
ndarray = "0.16"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "stream"] }
rquickjs = "0.11"
security-framework = "3"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
flate2 = "1"
hex = "0.4"
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic-messages", "trace", "with-serde"] }
percent-encoding = "2"
plist = "1"
libc = "0.2"
prost = "0.14"
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zstd = "0.13"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
strip = "debuginfo"
